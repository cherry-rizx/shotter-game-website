<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobile Shooter</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }
    canvas {
      display: block;
      background: #111;
    }
    #joystick, #stick {
      position: absolute;
      border-radius: 50%;
      z-index: 10;
      touch-action: none;
    }
    #joystick {
      width: 140px;
      height: 140px;
      background: rgba(255,255,255,0.05);
      left: 30px;
      bottom: 30px;
    }
    #stick {
      width: 60px;
      height: 60px;
      background: rgba(255,255,255,0.3);
      left: 40px;
      top: 40px;
    }
    #fireBtn {
      position: absolute;
      width: 100px;
      height: 100px;
      background: red;
      border-radius: 50%;
      right: 30px;
      bottom: 30px;
      z-index: 10;
      touch-action: none;
    }
    #hud {
      position: absolute;
      color: white;
      font-family: sans-serif;
      font-size: 18px;
      top: 10px;
      left: 10px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="joystick"><div id="stick"></div></div>
  <div id="fireBtn"></div>
  <div id="hud">HP: 100<br>Score: 0<br>Level: 0</div>
  <script src="game.js"></script>
</body>
</html>
